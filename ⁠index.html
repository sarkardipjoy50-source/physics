<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cyberpunk Particle Physics & Audio Matrix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #000; color: #fff; overflow: hidden; }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

        /* Cyberpunk UI Overlay */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(5, 5, 15, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 18px 24px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
            max-width: 380px;
        }
        h1 { font-size: 18px; color: #00f3ff; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; font-weight: 800; text-shadow: 0 0 10px #00f3ff; }
        p { font-size: 12px; color: #a1a1aa; line-height: 1.5; margin-bottom: 12px; }
        
        .control-panel { display: flex; flex-direction: column; gap: 10px; }
        .mode-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .mode-btn:hover, .mode-btn.active {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 15px #00f3ff;
        }

        .stats { margin-top: 10px; font-size: 11px; color: #ff0055; font-family: monospace; }
        
        .hint-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #ff0055;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            color: #ff0055;
            letter-spacing: 1px;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(ff, 0, 85, 0.4);
        }
    </style>
</head>
<body>

    <div id="hud">
        <h1>✨ CYBER-PARTICLE MATRIX 3D</h1>
        <p>২০,০০০+ সজীব পার্টিকল এবং সিন্থ-সাউন্ড ফিল্ড। আপনার মাউস এবং স্পর্শ দিয়ে ম্যাট্রিক্সটি পরিবর্তন করুন।</p>
        
        <div class="control-panel">
            <button class="mode-btn active" id="btn-attract" onclick="setMode('attract')">🌀 Mode 1: Gravity Vortex (আকর্ষণ)</button>
            <button class="mode-btn" id="btn-repel" onclick="setMode('repel')">💥 Mode 2: Shockwave Repel (বিকর্ষণ)</button>
            <button class="mode-btn" id="btn-wave" onclick="setMode('wave')">🌊 Mode 3: Cosmic Wave Flow</button>
        </div>
        <div class="stats" id="fps-counter">PARTICLES: 25,000 | REALTIME SYNTH: ACTIVE</div>
    </div>

    <div class="hint-box">🖱️ স্ক্রিনে মাউস ড্র্যাগ করে থ্রিডি ওয়ার্ল্ড ঘুরান | ক্লিক করে শক্-ওয়েভ সৃষ্টি করুন</div>

    <div id="canvas-container"></div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, particleSystem, particleGeo;
        let particlesCount = 25000;
        let positions, velocities, colors;
        let mouse = new THREE.Vector2(-999, -999);
        let raycaster = new THREE.Raycaster();
        let currentMode = 'attract';
        let audioCtx = null;

        function init() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.002);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(0, 0, 400);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Create 3D Particles Matrix
            particleGeo = new THREE.BufferGeometry();
            positions = new Float32Array(particlesCount * 3);
            velocities = new Float32Array(particlesCount * 3);
            colors = new Float32Array(particlesCount * 3);

            const color1 = new THREE.Color(0x00f3ff);
            const color2 = new THREE.Color(0xff0055);

            for (let i = 0; i < particlesCount; i++) {
                // Sphere dispersion
                let u = Math.random();
                let v = Math.random();
                let theta = u * 2.0 * Math.PI;
                let phi = Math.acos(2.0 * v - 1.0);
                let r = Math.cbrt(Math.random()) * 250;

                let x = r * Math.sin(phi) * Math.cos(theta);
                let y = r * Math.sin(phi) * Math.sin(theta);
                let z = r * Math.cos(phi);

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                velocities[i * 3] = (Math.random() - 0.5) * 0.5;
                velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.5;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.5;

                let mixedColor = color1.clone().lerp(color2, Math.random());
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Custom Texture Shader feel using points
            const particleMat = new THREE.PointsMaterial({
                size: 2.5,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.85
            });

            particleSystem = new THREE.Points(particleGeo, particleMat);
            scene.add(particleSystem);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClickTrigger);

            animate();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onClickTrigger(event) {
            initAudio();
            playSynthSound();

            // Trigger explosive burst
            let p = particleGeo.attributes.position.array;
            for (let i = 0; i < particlesCount; i++) {
                velocities[i * 3] += (Math.random() - 0.5) * 8;
                velocities[i * 3 + 1] += (Math.random() - 0.5) * 8;
                velocities[i * 3 + 2] += (Math.random() - 0.5) * 8;
            }
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSynthSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220 + Math.random() * 440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.6);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        function animate() {
            requestAnimationFrame(animate);

            let p = particleGeo.attributes.position.array;
            let time = Date.now() * 0.001;

            // Target Point in 3D Space derived from Mouse
            let targetX = mouse.x * 300;
            let targetY = mouse.y * 300;

            for (let i = 0; i < particlesCount; i++) {
                let px = p[i * 3];
                let py = p[i * 3 + 1];
                let pz = p[i * 3 + 2];

                if (currentMode === 'attract') {
                    // Pull particles to mouse center like a Black Hole
                    let dx = targetX - px;
                    let dy = targetY - py;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 200) {
                        velocities[i * 3] += (dx / dist) * 0.4;
                        velocities[i * 3 + 1] += (dy / dist) * 0.4;
                    }
                } else if (currentMode === 'repel') {
                    // Push particles away
                    let dx = px - targetX;
                    let dy = py - targetY;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        velocities[i * 3] += (dx / dist) * 1.5;
                        velocities[i * 3 + 1] += (dy / dist) * 1.5;
                    }
                } else if (currentMode === 'wave') {
                    // Sine Wave motion
                    velocities[i * 3 + 1] += Math.sin(time + px * 0.02) * 0.05;
                }

                // Apply velocity with damping friction
                p[i * 3] += velocities[i * 3];
                p[i * 3 + 1] += velocities[i * 3 + 1];
                p[i * 3 + 2] += velocities[i * 3 + 2];

                velocities[i * 3] *= 0.96;
                velocities[i * 3 + 1] *= 0.96;
                velocities[i * 3 + 2] *= 0.96;
            }

            particleGeo.attributes.position.needsUpdate = true;
            particleSystem.rotation.y = time * 0.05;
            particleSystem.rotation.x = time * 0.02;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
